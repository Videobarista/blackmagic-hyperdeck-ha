name: "Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: "Pytest"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: "Install test dependencies"
        run: pip install pytest-homeassistant-custom-component
      - name: "Run tests"
        run: pytest
