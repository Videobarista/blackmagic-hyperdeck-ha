name: "Ruff"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ruff:
    name: "Ruff lint"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: "Install ruff"
        run: pip install ruff
      - name: "Ruff lint"
        run: ruff check .
